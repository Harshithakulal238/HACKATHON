<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
  <title id="title">Sample museum floor plan</title>
  <desc id="description">A simple museum layout with four galleries connected by a central corridor, an entrance, and an exit.</desc>
  <rect width="1000" height="650" fill="#f7f0e5"/>
  <rect x="28" y="28" width="944" height="594" rx="14" fill="#fffaf3" stroke="#49352f" stroke-width="10"/>

  <g fill="#f1e7d8" stroke="#49352f" stroke-width="7">
    <rect x="72" y="225" width="132" height="198" rx="8"/>
    <rect x="240" y="72" width="286" height="164" rx="8"/>
    <rect x="556" y="72" width="286" height="164" rx="8"/>
    <rect x="240" y="414" width="286" height="164" rx="8"/>
    <rect x="556" y="414" width="286" height="164" rx="8"/>
    <rect x="422" y="260" width="156" height="130" rx="8"/>
    <rect x="842" y="225" width="86" height="198" rx="8"/>
  </g>

  <g fill="#d8c5a5" stroke="#b08d57" stroke-width="3">
    <rect x="204" y="280" width="218" height="88" rx="10"/>
    <rect x="578" y="280" width="264" height="88" rx="10"/>
    <rect x="450" y="236" width="100" height="24" rx="4"/>
    <rect x="450" y="390" width="100" height="24" rx="4"/>
  </g>

  <g fill="#49352f" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="138" y="309" font-size="21" font-weight="700">ENTRANCE</text>
    <text x="138" y="337" font-size="16">Welcome hall</text>
    <text x="383" y="151" font-size="23" font-weight="700">GALLERY 1</text>
    <text x="699" y="151" font-size="23" font-weight="700">GALLERY 2</text>
    <text x="383" y="493" font-size="23" font-weight="700">GALLERY 3</text>
    <text x="699" y="493" font-size="23" font-weight="700">GALLERY 4</text>
    <text x="500" y="322" font-size="18" font-weight="700">CENTRAL</text>
    <text x="500" y="345" font-size="18" font-weight="700">COURT</text>
    <text x="885" y="309" font-size="19" font-weight="700">EXIT</text>
  </g>

  <g fill="none" stroke="#722f37" stroke-linecap="round" stroke-width="7">
    <path d="M204 324H240"/>
    <path d="M526 154H556"/>
    <path d="M526 496H556"/>
    <path d="M500 236V260"/>
    <path d="M500 390V414"/>
    <path d="M578 324H842"/>
    <path d="M842 324H870"/>
  </g>

  <g fill="#722f37">
    <path d="M222 314l12 10-12 10z"/>
    <path d="M870 314l12 10-12 10z"/>
  </g>

  <text x="500" y="605" fill="#66554b" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">
    SAMPLE LAYOUT - add exhibit markers and walking paths in the map editor
  </text>
</svg>
