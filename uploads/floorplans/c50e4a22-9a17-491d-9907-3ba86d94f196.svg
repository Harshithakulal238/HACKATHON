<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000.0000 650.0000" width="1000" height="650" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Léviōsa Museum Interactive Floor Map</title>
  <desc id="map-desc">Schematic architectural floorplan of the Léviōsa Museum featuring Entrance, Exit, Galleries A through F, Junctions J1 through J6, and connected walking corridors.</desc>

  <defs>
    
    <pattern id="hall-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.75" fill="#D6D0C4" opacity="0.65" />
    </pattern>

    
    <filter id="room-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>

    <style>
      .bg-canvas { fill: #F8F6F0; }
      .outer-wall { fill: #EFECE4; stroke: #2B343B; stroke-width: 4; }

      /* Corridor styling */
      .corridor-bed {
        fill: none;
        stroke: #E2DDD2;
        stroke-width: 24;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .corridor-border {
        fill: none;
        stroke: #C8C1B2;
        stroke-width: 26;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.55;
      }
      .corridor-path {
        fill: none;
        stroke: #64748B;
        stroke-width: 2.5;
        stroke-dasharray: 6 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Gallery blocks */
      .gallery-room {
        fill: #FCFBF7;
        stroke: #2B343B;
        stroke-width: 2;
        filter: url(#room-shadow);
      }
      .gallery-room-alt {
        fill: #F6F3EB;
        stroke: #2B343B;
        stroke-width: 2;
        filter: url(#room-shadow);
      }
      .gallery-badge {
        fill: #2B343B;
      }
      .gallery-badge-text {
        fill: #FFFFFF;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .gallery-title {
        fill: #1E293B;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 14.5px;
        font-weight: 700;
      }
      .gallery-subtitle {
        fill: #475569;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 11.5px;
        font-weight: 600;
      }
      .exhibit-item {
        fill: #334155;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 10.5px;
        font-weight: 400;
      }

      /* Junctions */
      .junction-outer {
        fill: #FFFFFF;
        stroke: #2B343B;
        stroke-width: 2;
      }
      .junction-inner {
        fill: #0F766E;
      }
      .junction-label {
        fill: #0F172A;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        text-anchor: middle;
      }

      /* Entrance &amp; Exit */
      .portal-entrance-box {
        fill: #E6F4F1;
        stroke: #0F766E;
        stroke-width: 2.2;
      }
      .portal-exit-box {
        fill: #FEF3E6;
        stroke: #B45309;
        stroke-width: 2.2;
      }
      .portal-title-entrance {
        fill: #0F766E;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .portal-title-exit {
        fill: #B45309;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
      }

      /* Header &amp; Legend */
      .header-title {
        fill: #1E293B;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
      }
      .header-sub {
        fill: #64748B;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 500;
      }
      .legend-text {
        fill: #334155;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        dominant-baseline: central;
      }
    </style>
  </defs>

  
  <rect x="0" y="0" width="1000" height="650" class="bg-canvas" />

  
  <g id="map-header">
    <text x="50" y="32" class="header-title">LÉVIŌSA MUSEUM — FLOOR MAP</text>
    <text x="50" y="48" class="header-sub">Schematic Wayfinding &amp; Graph Navigation Layout (Galleries A–F · Junctions J1–J6)</text>
  </g>

  
  <g id="museum-structure">
    <rect x="50" y="60" width="900" height="560" rx="12" class="outer-wall" />
    <rect x="52" y="62" width="896" height="556" rx="10" fill="url(#hall-grid)" />

    
    <g id="central-atrium" opacity="0.75">
      <circle cx="500" cy="340" r="45" fill="#F2EFE7" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
      <text x="500" y="336" text-anchor="middle" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1">ATRIUM</text>
      <text x="500" y="349" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Central Concourse</text>
    </g>
  </g>

  
  <g id="corridor-beds">
    
    <line x1="300" y1="565" x2="300" y2="505" class="corridor-border" />
    <line x1="300" y1="565" x2="300" y2="505" class="corridor-bed" />

    <line x1="700" y1="505" x2="700" y2="565" class="corridor-border" />
    <line x1="700" y1="505" x2="700" y2="565" class="corridor-bed" />

    
    <line x1="300" y1="505" x2="700" y2="505" class="corridor-border" />
    <line x1="300" y1="505" x2="700" y2="505" class="corridor-bed" />

    
    <line x1="300" y1="505" x2="300" y2="340" class="corridor-border" />
    <line x1="300" y1="505" x2="300" y2="340" class="corridor-bed" />

    <line x1="700" y1="505" x2="700" y2="340" class="corridor-border" />
    <line x1="700" y1="505" x2="700" y2="340" class="corridor-bed" />

    
    <line x1="300" y1="340" x2="700" y2="340" class="corridor-border" />
    <line x1="300" y1="340" x2="700" y2="340" class="corridor-bed" />

    
    <polyline points="300,340 300,180 400,180" class="corridor-border" />
    <polyline points="300,340 300,180 400,180" class="corridor-bed" />

    <polyline points="600,180 700,180 700,340" class="corridor-border" />
    <polyline points="600,180 700,180 700,340" class="corridor-bed" />

    
    <line x1="400" y1="180" x2="600" y2="180" class="corridor-border" />
    <line x1="400" y1="180" x2="600" y2="180" class="corridor-bed" />

    
    <line x1="245" y1="422" x2="300" y2="422" class="corridor-border" />
    <line x1="245" y1="422" x2="300" y2="422" class="corridor-bed" />

    <line x1="245" y1="257" x2="300" y2="257" class="corridor-border" />
    <line x1="245" y1="257" x2="300" y2="257" class="corridor-bed" />

    <line x1="400" y1="155" x2="400" y2="180" class="corridor-border" />
    <line x1="400" y1="155" x2="400" y2="180" class="corridor-bed" />

    <line x1="600" y1="155" x2="600" y2="180" class="corridor-border" />
    <line x1="600" y1="155" x2="600" y2="180" class="corridor-bed" />

    <line x1="700" y1="422" x2="755" y2="422" class="corridor-border" />
    <line x1="700" y1="422" x2="755" y2="422" class="corridor-bed" />

    <line x1="700" y1="257" x2="755" y2="257" class="corridor-border" />
    <line x1="700" y1="257" x2="755" y2="257" class="corridor-bed" />
  </g>

  
  <g id="corridor-paths">
    <path id="path-entrance-J1" d="M 300 565 L 300 505" class="corridor-path" />
    <path id="path-J2-exit" d="M 700 505 L 700 565" class="corridor-path" />

    <path id="path-J1-J2" d="M 300 505 L 700 505" class="corridor-path" />
    <path id="path-J1-J3" d="M 300 505 L 300 340" class="corridor-path" />
    <path id="path-J2-J4" d="M 700 505 L 700 340" class="corridor-path" />
    <path id="path-J3-J4" d="M 300 340 L 700 340" class="corridor-path" />
    <path id="path-J3-J5" d="M 300 340 L 300 180 L 400 180" class="corridor-path" />
    <path id="path-J4-J6" d="M 700 340 L 700 180 L 600 180" class="corridor-path" />
    <path id="path-J5-J6" d="M 400 180 L 600 180" class="corridor-path" />

    <path id="path-J1-J3-A" d="M 245 422 L 300 422" class="corridor-path" />
    <path id="path-J3-J5-D" d="M 245 257 L 300 257" class="corridor-path" />
    <path id="path-J5-B" d="M 400 155 L 400 180" class="corridor-path" />
    <path id="path-J6-E" d="M 600 155 L 600 180" class="corridor-path" />
    <path id="path-J2-J4-C" d="M 700 422 L 755 422" class="corridor-path" />
    <path id="path-J4-J6-F" d="M 700 257 L 755 257" class="corridor-path" />
  </g>

  
  <g id="route-highlight-layer" pointer-events="none"></g>

  
  <g id="galleries">
    
    <g id="gallery-A">
      <rect x="75" y="377" width="170" height="90" rx="7" class="gallery-room" />
      <rect x="88" y="389" width="22" height="20" rx="4" class="gallery-badge" />
      <text x="99" y="399" class="gallery-badge-text">A</text>
      <text x="117" y="403" class="gallery-title">Sculptures &amp; Statues</text>
      <text x="88" y="424" class="gallery-subtitle">Exhibits:</text>
      <text x="88" y="439" class="exhibit-item">• Nataraja Bronze Sculpture</text>
      <text x="88" y="453" class="exhibit-item">• Buddha Stone Statue</text>
    </g>

    
    <g id="gallery-D">
      <rect x="75" y="212" width="170" height="90" rx="7" class="gallery-room-alt" />
      <rect x="88" y="224" width="22" height="20" rx="4" class="gallery-badge" />
      <text x="99" y="234" class="gallery-badge-text">D</text>
      <text x="117" y="238" class="gallery-title">Stamps &amp; Seals</text>
      <text x="88" y="259" class="gallery-subtitle">Exhibits:</text>
      <text x="88" y="274" class="exhibit-item">• Indus Valley Unicorn Seal</text>
      <text x="88" y="288" class="exhibit-item">• Royal Copper Seal</text>
    </g>

    
    <g id="gallery-B">
      <rect x="310" y="75" width="180" height="80" rx="7" class="gallery-room" />
      <rect x="323" y="86" width="22" height="20" rx="4" class="gallery-badge" />
      <text x="334" y="96" class="gallery-badge-text">B</text>
      <text x="352" y="100" class="gallery-title">Jewelry &amp; Ornaments</text>
      <text x="323" y="121" class="exhibit-item">• Gold Temple Necklace</text>
      <text x="323" y="135" class="exhibit-item">• Silver Anklets</text>
    </g>

    
    <g id="gallery-E">
      <rect x="510" y="75" width="180" height="80" rx="7" class="gallery-room-alt" />
      <rect x="523" y="86" width="22" height="20" rx="4" class="gallery-badge" />
      <text x="534" y="96" class="gallery-badge-text">E</text>
      <text x="552" y="100" class="gallery-title">Fossils &amp; Minerals</text>
      <text x="523" y="121" class="exhibit-item">• Ammonite Fossil</text>
      <text x="523" y="135" class="exhibit-item">• Quartz Crystal</text>
    </g>

    
    <g id="gallery-C">
      <rect x="755" y="377" width="170" height="90" rx="7" class="gallery-room" />
      <rect x="768" y="389" width="22" height="20" rx="4" class="gallery-badge" />
      <text x="779" y="399" class="gallery-badge-text">C</text>
      <text x="797" y="403" class="gallery-title">Musical Instruments</text>
      <text x="768" y="424" class="gallery-subtitle">Exhibits:</text>
      <text x="768" y="439" class="exhibit-item">• Saraswati Veena</text>
      <text x="768" y="453" class="exhibit-item">• Mridangam</text>
    </g>

    
    <g id="gallery-F">
      <rect x="755" y="212" width="170" height="90" rx="7" class="gallery-room-alt" />
      <rect x="768" y="224" width="22" height="20" rx="4" class="gallery-badge" />
      <text x="779" y="234" class="gallery-badge-text">F</text>
      <text x="797" y="238" class="gallery-title">Vehicles &amp; Transport</text>
      <text x="768" y="259" class="gallery-subtitle">Exhibits:</text>
      <text x="768" y="274" class="exhibit-item">• Traditional Bullock Cart</text>
      <text x="768" y="288" class="exhibit-item">• Vintage Motorcycle</text>
    </g>
  </g>

  
  <g id="junctions">
    <g id="junction-J1">
      <circle cx="300" cy="505" r="9.5" class="junction-outer" />
      <circle cx="300" cy="505" r="4" class="junction-inner" />
      <text x="278" y="509" text-anchor="end" class="junction-label">J1</text>
    </g>

    <g id="junction-J2">
      <circle cx="700" cy="505" r="9.5" class="junction-outer" />
      <circle cx="700" cy="505" r="4" class="junction-inner" />
      <text x="722" y="509" text-anchor="start" class="junction-label">J2</text>
    </g>

    <g id="junction-J3">
      <circle cx="300" cy="340" r="9.5" class="junction-outer" />
      <circle cx="300" cy="340" r="4" class="junction-inner" />
      <text x="278" y="344" text-anchor="end" class="junction-label">J3</text>
    </g>

    <g id="junction-J4">
      <circle cx="700" cy="340" r="9.5" class="junction-outer" />
      <circle cx="700" cy="340" r="4" class="junction-inner" />
      <text x="722" y="344" text-anchor="start" class="junction-label">J4</text>
    </g>

    <g id="junction-J5">
      <circle cx="400" cy="180" r="9.5" class="junction-outer" />
      <circle cx="400" cy="180" r="4" class="junction-inner" />
      <text x="400" y="201" class="junction-label">J5</text>
    </g>

    <g id="junction-J6">
      <circle cx="600" cy="180" r="9.5" class="junction-outer" />
      <circle cx="600" cy="180" r="4" class="junction-inner" />
      <text x="600" y="201" class="junction-label">J6</text>
    </g>
  </g>

  
  <g id="portals">
    <g id="entrance">
      <rect x="245" y="565" width="110" height="32" rx="6" class="portal-entrance-box" />
      <text x="300" y="581" class="portal-title-entrance">▲ ENTRANCE</text>
    </g>

    <g id="exit">
      <rect x="645" y="565" width="110" height="32" rx="6" class="portal-exit-box" />
      <text x="700" y="581" class="portal-title-exit">EXIT ▲</text>
    </g>
  </g>

  
  <g id="map-legend" transform="translate(375, 567)">
    <rect x="0" y="0" width="250" height="28" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <line x1="12" y1="14" x2="35" y2="14" class="corridor-path" />
    <text x="40" y="14" class="legend-text">Corridor</text>

    <circle cx="95" cy="14" r="5" class="junction-outer" />
    <circle cx="95" cy="14" r="2" class="junction-inner" />
    <text x="105" y="14" class="legend-text">Junction</text>

    <rect x="158" y="8" width="12" height="12" rx="2.5" fill="#FCFBF7" stroke="#2B343B" stroke-width="1.2" />
    <text x="176" y="14" class="legend-text">Gallery</text>
  </g>
</svg>